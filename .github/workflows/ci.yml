name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fieldline-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fieldline
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldline -d fieldline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      FIELDLINE_DATABASE_URL: postgresql+psycopg://fieldline:fieldline@localhost:5432/fieldline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: python -m pip install ".[dev]"

      - name: Lint source and tests
        run: ruff check app tests

      - name: Compile Python modules
        run: python -m compileall -q app tests migrations

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run tests with statement and branch coverage
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing:skip-covered

      - name: Build backend Docker image
        run: docker build --pull --tag fieldline-crm-backend:ci .

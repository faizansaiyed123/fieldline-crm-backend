name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fieldline
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldline -d fieldline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      FIELDLINE_DATABASE_URL: postgresql+psycopg://fieldline:fieldline@localhost:5432/fieldline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend
        run: python -m pip install ".[dev]"

      - name: Lint source and tests
        run: ruff check app tests

      - name: Compile Python modules
        run: python -m compileall -q app tests migrations

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker stack
        run: |
          docker compose up -d || {
            docker compose ps -a
            docker compose logs postgres
            ss -ltnp | grep ':5432' || true
            exit 1
          }

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready >/tmp/fieldline-ready.json; then
              cat /tmp/fieldline-ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify backend root
        run: curl --fail --silent http://127.0.0.1:8000/

      - name: Show Docker state
        run: docker compose ps

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fieldline
      POSTGRES_USER: fieldline
      POSTGRES_PASSWORD: fieldline
    ports:
      - "5432:5432"
    volumes:
      - fieldline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldline -d fieldline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      FIELDLINE_ENVIRONMENT: ${FIELDLINE_ENVIRONMENT:-development}
      FIELDLINE_DEBUG: ${FIELDLINE_DEBUG:-false}
      FIELDLINE_DATABASE_URL: ${FIELDLINE_DATABASE_URL:-postgresql+psycopg://fieldline:fieldline@postgres:5432/fieldline}
      FIELDLINE_API_PREFIX: ${FIELDLINE_API_PREFIX:-/api/v1}
      FIELDLINE_JWT_SECRET_KEY: ${FIELDLINE_JWT_SECRET_KEY:-development-only-change-me-development-only}
      FIELDLINE_JWT_ALGORITHM: ${FIELDLINE_JWT_ALGORITHM:-HS256}
      FIELDLINE_JWT_ISSUER: ${FIELDLINE_JWT_ISSUER:-fieldline-api}
      FIELDLINE_JWT_AUDIENCE: ${FIELDLINE_JWT_AUDIENCE:-fieldline-web}
      FIELDLINE_ACCESS_TOKEN_EXPIRE_MINUTES: ${FIELDLINE_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      FIELDLINE_REFRESH_TOKEN_EXPIRE_DAYS: ${FIELDLINE_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FIELDLINE_SECURE_COOKIES: ${FIELDLINE_SECURE_COOKIES:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fieldline-postgres:

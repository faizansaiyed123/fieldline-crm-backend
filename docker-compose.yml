services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fieldline
      POSTGRES_USER: fieldline
      POSTGRES_PASSWORD: fieldline
    ports:
      - "5432:5432"
    volumes:
      - fieldline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldline -d fieldline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fieldline-postgres:

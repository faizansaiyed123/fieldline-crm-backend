[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldline-crm-backend"
version = "0.1.0"
description = "Production-minded Small Business CRM backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=25,<26",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
  "ruff>=0.16.8,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
